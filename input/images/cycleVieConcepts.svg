<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="127px" preserveAspectRatio="none" style="width:1061px;height:127px;background:#FFFFFF;" version="1.1" viewBox="0 0 1061 127" width="1061px" zoomAndPan="magnify"><defs/><g><rect fill="#D8F0D8" height="62.8281" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="179" x="136" y="7"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="43" x="204" y="26.5332">active</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169" x="141" y="44.1426">Concept valid&#233; et utilisable</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96" x="177.5" y="61.752">sans restriction</text><rect fill="#FFE0B3" height="62.8281" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="228" x="449" y="7"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="81" x="522.5" y="26.5332">deprecated</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="218" x="454" y="44.1426">Concept toujours valide, mais dont</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="171" x="477.5" y="61.752">l'utilisation est d&#233;conseill&#233;e</text><rect fill="#E3E3E3" height="62.8281" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="234" x="821" y="7"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="48" x="914" y="26.5332">retired</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="224" x="826" y="44.1426">Concept conserv&#233; pour l'historique,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122" x="877" y="61.752">usage non autoris&#233;</text><ellipse cx="16" cy="38.5" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><!--link *start* to active--><g id="link_*start*_active"><path d="M26.18,38.5 C45.6,38.5 86.58,38.5 129.95,38.5 " fill="none" id="*start*-to-active" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="135.95,38.5,126.95,34.5,130.95,38.5,126.95,42.5,135.95,38.5" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48" x="57" y="34.9951">Cr&#233;ation</text></g><!--link active to deprecated--><g id="link_active_deprecated"><path d="M315.09,38.5 C356.05,38.5 399.19,38.5 442.8,38.5 " fill="none" id="active-to-deprecated" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="448.8,38.5,439.8,34.5,443.8,38.5,439.8,42.5,448.8,38.5" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="72" x="346" y="34.9951">D&#233;pr&#233;ciation</text></g><!--link deprecated to retired--><g id="link_deprecated_retired"><path d="M677.18,38.5 C722.63,38.5 768.98,38.5 814.74,38.5 " fill="none" id="deprecated-to-retired" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="820.74,38.5,811.74,34.5,815.74,38.5,811.74,42.5,820.74,38.5" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="82" x="708" y="34.9951">Retrait d&#233;finitif</text></g><!--link active to retired--><g id="link_active_retired"><path d="M310.23,70.04 C351.38,83.91 402.1,98.59 449,105.5 C549.25,120.26 576.47,118.24 677,105.5 C731.34,98.61 784.8042,85.5899 832.9842,71.7199 " fill="none" id="active-to-retired" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" po